name: Build APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Habilitar arquitetura i386
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get install -y \
            zip \
            unzip \
            git \
            python3-pip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5:i386 \
            libstdc++6:i386 \
            zlib1g:i386

      - name: Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install cython==0.29.36

      - name: Verificar arquivos do projeto
        run: |
          echo "Arquivos encontrados no projeto:"
          find . -maxdepth 2 -type f | sort
          echo ""
          echo "Verificando buildozer.spec:"
          test -f buildozer.spec

      - name: Compilar APK de debug
        run: |
          yes | buildozer android debug

      - name: Verificar APK gerado
        run: |
          echo "APKs encontrados:"
          find bin -type f -name "*.apk" -print
          test -n "$(find bin -type f -name '*.apk' -print -quit)"
          ls -lh bin/*.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
          if-no-files-found: error
