name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            python3-dev \
            openjdk-17-jdk \
            zip \
            unzip \
            autoconf \
            libtool \
            cmake \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblzma-dev \
            readline-common \
            libreadline-dev \
            uuid-dev \
            lzma-dev

      - name: Install Python tools & Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0"
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Fix Android SDK tools & Accept Licenses
        run: |
          # 1. Cria a estrutura do Android SDK e baixa o cmdline-tools
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9441913_latest.zip -O commandlinetools.zip
          unzip -q commandlinetools.zip -d ~/.buildozer/android/platform/android-sdk/cmdline-tools
          mv ~/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          rm commandlinetools.zip

          # 2. Cria a ponte (link) da pasta antiga 'tools/bin' para a pasta nova 'cmdline-tools/latest/bin'
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools
          ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin ~/.buildozer/android/platform/android-sdk/tools/bin

          # 3. Aceita todas as licenças do SDK
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses || true

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app-apk
          path: bin/*.apk
