name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev openjdk-17-jdk zip unzip autoconf libtool cmake libsqlite3-dev sqlite3 bzip2 libbz2-dev libgdbm-dev libgdbm-compat-dev liblzma-dev readline-common libreadline-dev uuid-dev lzma-dev
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0"
          pip install buildozer

      - name: Build APK with Buildozer Action
        uses: SubhiCoder/buildozer-action@v1
        with:
          command: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app-apk
          path: bin/*.apk
