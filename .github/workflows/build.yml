name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev

        pip install --upgrade pip
        pip install buildozer cython==0.29.36 kivy

    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/#title = My Application/title = Vivarium Flora e Fauna/g' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = vivarium/g' buildozer.spec
        sed -i 's/#package.domain = org.test/package.domain = org.vivarium/g' buildozer.spec
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy/g' buildozer.spec
        sed -i 's/orientation = portrait/orientation = portrait/g' buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: apk-file
        path: bin/*.apk
