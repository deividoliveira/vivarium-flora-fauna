name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-pip \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            unzip \
            ccache \
            autoconf \
            libtool \
            pkg-config \
            libssl-dev
          
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK with Buildozer
        run: |
          # Aceita antecipadamente todas as licenças do SDK no ambiente local do Buildozer
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Cria as licenças aceitas para o Buildozer reutilizar
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n89339e8354178c39123e157b764103d733013784\nd56f518547953242c18f6c296b301120982ae3ab\n24333f8a637b3702d593958b04e5e001d4314d4f" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9402116da56f5659327e025000e396200e" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
