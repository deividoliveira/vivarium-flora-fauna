name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            python3-dev \
            openjdk-17-jdk \
            zip \
            unzip \
            autoconf \
            libtool \
            cmake \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblzma-dev \
            readline-common \
            libreadline-dev \
            uuid-dev \
            lzma-dev

      - name: Install Python tools & Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0"
          pip install buildozer

      # Prepara as licenças diretamente no diretório do Buildozer
      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n89330112245960e1115721783094391c148f300a\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a6378b2d495143f22b2aae739dd612307" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b94fe5304cd6ef81204128e469a467c4309" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app-apk
          path: bin/*.apk
