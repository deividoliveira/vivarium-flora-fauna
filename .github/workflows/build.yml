name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-pip \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip \
            ccache \
            autoconf \
            libtool \
            pkg-config \
            libssl-dev
          
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK with Buildozer
        run: |
          # Prepara o diretório e pré-aceita as licenças sem quebrar o pipe
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Inicializa a estrutura do SDK antes do build para aceitar as licenças
          buildozer android update || true
          
          # Aceita as licenças do SDK instalado pelo Buildozer
          if [ -d "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" ]; then
            yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

          # Compila o projeto
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
