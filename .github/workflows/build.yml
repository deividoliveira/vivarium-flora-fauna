name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Define explicitamente o Python 3.10 ou 3.11 para evitar inconsistências
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.11'

      # Instala as dependências de build atualizadas
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev readline-common libreadline-dev libffi-dev uuid-dev lzma-dev
          pip install --upgrade pip setuptools buildozer Cython

      # Executa o buildozer para gerar o APK
      - name: Build with Buildozer
        run: |
          buildozer -v android debug

      # Armazena o artefato (APK) gerado
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
