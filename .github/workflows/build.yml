name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Python
  uses: actions/setup-python@v5
  with:
  
    python-version: '3.11'

    requirements = python3==3.11.9,kivy,certifi,chardet,filetype,idna,requests,six,urllib3
    
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with Buildozer Action
        uses: digipost/buildozer-action@v1
        with:
          WORKDIR: '.'
          BUILDER_VERSION: 'master'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app-apk
          path: bin/*.apk
